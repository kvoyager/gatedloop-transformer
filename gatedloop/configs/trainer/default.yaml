max_steps: 30000
val_check_interval: 1000
log_every_n_steps: 50
gradient_clip_val: 1.0
gradient_clip_algorithm: norm
accelerator: gpu
devices: 1
precision: bf16-mixed
accumulate_grad_batches: 1
# Validation batches run BEFORE training to catch val-loop bugs early. Set 0 to
# skip the startup eval (avoids the random-init "huge perplexity" readout).
num_sanity_val_steps: 2
# torch.compile the model. Off by default: with loop_sample=true each distinct R
# triggers its own compile, and checkpoint keys gain an _orig_mod. prefix (the
# checkpoint loader strips it).
compile: false
